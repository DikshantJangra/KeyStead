[project]
name = "keystead"
version = "0.1.0"
description = "Your agency does the work. Your keys stay with you."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "pyyaml>=6",
    "cryptography>=42",
    "cloudflare>=4",
    "typer>=0.12",
]

[project.optional-dependencies]
octodns = ["octodns>=1.4", "octodns-cloudflare>=0.0.7"]

[project.scripts]
keystead = "keystead.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keystead"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
