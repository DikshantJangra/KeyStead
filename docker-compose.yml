services:
  keystead-gate:
    build: .
    image: keystead:latest
    restart: unless-stopped
    user: "10001:10001"
    env_file: .env
    environment:
      KEYSTEAD_DATA_DIR: /app/data
      KEYSTEAD_CONFIG: /app/config/keystead.yaml
      # inside Docker, localhost is the container; reach a Switch server on the host:
      SWITCH_URL: ${SWITCH_URL_FROM_DOCKER:-http://host.docker.internal:8000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional: Postiz for social.publish_post (AGPL-3.0, separate service, HTTP only).
  # Start with `docker compose --profile social up`. See https://docs.postiz.com for its
  # full requirements (Postgres, Redis, JWT_SECRET, MAIN_URL); then set
  # connectors.postiz_social.base_url to http://postiz:5000/api.
  postiz:
    profiles: [social]
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      MAIN_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-change-me}
      DATABASE_URL: postgresql://postiz:postiz@postiz-db:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    ports: ["5000:5000"]
    depends_on: [postiz-db, postiz-redis]
  postiz-db:
    profiles: [social]
    image: postgres:17-alpine
    environment: {POSTGRES_USER: postiz, POSTGRES_PASSWORD: postiz, POSTGRES_DB: postiz}
    volumes: [postiz-db:/var/lib/postgresql/data]
  postiz-redis:
    profiles: [social]
    image: redis:7-alpine

volumes:
  postiz-db:
